<!doctype html><html lang="id"><head><base target="_top"><meta charset="utf-8"><title>KUMAT – Keluar Masuk Tools</title><meta name="robots" content="noindex"><meta name="theme-color" content="#0a2f7a">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--bg:#eef3fb;--cd:#fff;--tx:#0f172a;--mu:#64748b;--br:#e5ebf5;--pr:#0b4fc4;--nv:#0a2f7a}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{background:linear-gradient(180deg,#0b3d9e,#072463);color:#fff;padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:3px}
.br{display:flex;gap:10px;align-items:center;padding:4px 8px 20px}.br b{font-size:22px;display:block;line-height:1}.br small{font-size:11px;opacity:.85}.lg{font-size:30px}
aside a{display:flex;gap:12px;align-items:center;padding:11px 12px;border-radius:10px;color:#cfe0ff;cursor:pointer}aside a i{font-style:normal;width:20px;text-align:center}aside a.on{background:#1a5fe0;color:#fff;font-weight:600}
.bz{margin-top:auto;padding:8px}.bz b{font-size:22px;display:block}.bz small{opacity:.8;font-size:11px}
#w{min-width:0}.top{display:flex;align-items:center;gap:12px;padding:20px 24px 4px}.top h2{margin:0;font-size:24px}.top .sub{margin:2px 0 0;color:var(--mu)}.top>div:nth-child(2){flex:1}.bk{display:none}
.rt{display:flex;gap:14px;align-items:center}.dt{background:var(--cd);border:1px solid var(--br);border-radius:10px;padding:8px 12px}.us{display:flex;gap:8px;align-items:center}.us i{width:36px;height:36px;border-radius:50%;background:var(--pr);color:#fff;display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:700}.us small{display:block;color:var(--mu);font-size:11px}
main{padding:14px 24px 28px;max-width:1240px}
h2{margin:0 0 4px;font-size:22px}.mu{color:var(--mu)}
.card{background:var(--cd);border:1px solid var(--br);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px #0a2f7a0d}
.g{display:grid;gap:14px}.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g6{grid-template-columns:repeat(6,1fr)}.gw{grid-template-columns:1.5fr 1fr}.gt{grid-template-columns:1fr 1.15fr}
.stc{display:flex;gap:12px;align-items:center;margin:0}.stc b{font-size:28px;display:block;line-height:1.1}.stc span{font-size:12px}
.ic{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:21px;color:#fff;flex:none}
.sf{border:1px solid var(--br);border-radius:12px;padding:10px 4px;text-align:center}.sf .si{font-size:26px}.sf span{display:block;font-size:11px;color:var(--mu)}.sf b{display:block;font-size:19px}.sf em{font-size:10px;font-style:normal}
.pill{color:#fff;border-radius:6px;padding:2px 8px;font-size:11px;font-weight:600;white-space:nowrap}
.row{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--br);cursor:pointer}.row:last-child{border:0}.row>div{flex:1;min-width:0}
.row img,.ph{width:54px;height:54px;border-radius:10px;object-fit:cover;background:var(--br);display:flex;align-items:center;justify-content:center;flex:none}
button{background:var(--pr);color:#fff;border:0;border-radius:10px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer}button.o{background:#fff;color:var(--pr);border:1px solid var(--pr)}button:disabled{opacity:.5}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--br);border-radius:10px;background:#fff;color:var(--tx);font:inherit}input[type=checkbox]{width:auto}
label{display:block;margin:8px 0 3px;font-weight:600;font-size:12px}
.chips,.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.chip{padding:5px 11px;border-radius:99px;border:1px solid var(--br);cursor:pointer;font-size:12px;background:#fff}.chip.on{background:var(--pr);color:#fff;border-color:var(--pr)}
.tabs span{padding:6px 12px;border-radius:8px;cursor:pointer;color:var(--mu)}.tabs span.on{background:#e8f0ff;color:var(--pr);font-weight:700}
.chk{display:flex;gap:8px;align-items:center;font-weight:400;font-size:13px;margin:5px 0}
table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:9px 6px;border-bottom:1px solid var(--br);font-size:13px;vertical-align:top}th{color:var(--mu);font-size:12px}.tbl{overflow-x:auto}
.donut{width:130px;height:130px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}.donut i{width:86px;height:86px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:700;font-size:22px}
.tm{display:flex;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--br)}.tm .ic{width:38px;height:38px;font-size:17px}.tm>div{flex:1}.tm b.n{font-size:16px}

.ba{display:grid;grid-template-columns:1fr 1fr;gap:8px}.ba img,.ba .ph{width:100%;height:120px;border-radius:10px;object-fit:cover}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:10px;display:none;z-index:10;max-width:90%}
.hm{min-height:100vh;display:flex;flex-direction:column;justify-content:flex-end;padding:28px;color:#fff;background:linear-gradient(180deg,#0a2f7a,#1a5fe0 55%,#0a2f7a)}.hm h1{font-size:44px;margin:0}.hm .lg{font-size:70px}.hm button{width:100%;margin-top:10px;padding:14px}.hm .o{background:transparent;color:#fff;border-color:#fff}.hm>div{max-width:420px;width:100%;margin:0 auto}
body.home aside,body.home .top{display:none}body.home #app{display:block}body.home main{padding:0;max-width:none}
.sc{max-width:480px;margin:0 auto;text-align:center}.vw{position:relative}.vw video{width:100%;height:340px;object-fit:cover;border-radius:16px;background:#0a1a3f}.fr{position:absolute;inset:50px 70px;border:3px solid #4d8dff;border-radius:14px}

.pw2{position:relative}.pw2 img{width:100%;display:block;border-radius:10px;background:#f1f5f9;object-fit:contain;max-height:300px}
.eye{position:absolute;right:8px;top:8px;width:36px;height:36px;padding:0;border-radius:50%;background:#000a;color:#fff;font-size:18px;line-height:36px;border:1px solid #fff6}

const nextId=p=>{let n=0;const re=new RegExp('^KUM-'+p+'-(\\d+)$');D.tools.forEach(t=>{const r=re.exec(t.id);if(r)n=Math.max(n,+r[1])});return'KUM-'+p+'-'+('00'+(n+1)).slice(-3)};
function addToolModal(){if(!isOwner())return;AT={img:''};modal(`<div style="display:flex;justify-content:space-between"><h2 style="font-size:18px">Tambah Alat Baru</h2><button class="o" onclick="modal()">✕</button></div>
<label>Nama alat</label><input id="an" placeholder="mis. DEVISER OTDR AE3100B">
<label>Kategori</label><select id="ac" onchange="atCat()"><option value="tool">Tools</option><option value="safety">Alat Keselamatan</option></select>
<label>Jenis (menentukan kode)</label><select id="ap" onchange="atPrev()"></select>
<input id="ap2" maxlength="6" placeholder="Kode jenis baru, mis. OTDR" style="display:none;margin-top:6px;text-transform:uppercase" oninput="atPrev()">
<p class="mu" style="margin:8px 0 0">Kode otomatis: <b id="aid">–</b></p>
<label>Catatan / kelengkapan (opsional)</label><input id="at" placeholder="mis. lengkap dengan charger & case">
<label class="chk" id="apw" style="display:none"><input type="checkbox" id="ape"> Barang personal (tidak dipinjamkan, mis. vest / helm)</label>
<label>Foto kondisi awal (wajib)</label><input type="file" accept="image/*" onchange="atPhoto(this.files[0])"><div id="ai"></div>
<div style="margin-top:12px;display:flex;gap:8px"><button id="ab" onclick="atSave()">Simpan & Buat Barcode</button><button class="o" onclick="modal()">Batal</button></div>`);atCat()}
function atCat(){const c=$('#ac').value;$('#ap').innerHTML=pfxList(c).map(([p,n])=>`<option value="${p}">${p} · ${esc(n)}</option>`).join('')+'<option value="__new">➕ Jenis baru…</option>';$('#apw').style.display=c==='safety'?'flex':'none';atPrev()}
function atPfx(){const v=$('#ap').value;return v==='__new'?$('#ap2').value.trim().toUpperCase():v}
function atPrev(){$('#ap2').style.display=$('#ap').value==='__new'?'block':'none';const p=atPfx();$('#aid').textContent=/^[A-Z0-9]{2,6}$/.test(p)?nextId(p):'–'}
function atPhoto(f){if(!f)return;shrink(f,d=>{AT.img=d;$('#ai').innerHTML=`<div style="margin-top:6px">${ph2(d,'Foto kondisi awal')}</div>`})}
function atSave(){const nama=$('#an').value.trim(),p=atPfx();if(!nama)return toast('Nama alat wajib diisi');if(!/^[A-Z0-9]{2,6}$/.test(p))return toast('Kode jenis harus 2–6 huruf/angka');if(!AT.img)return toast('Foto kondisi awal wajib diambil');
run($('#ab'),async()=>{const r=await api('addTool',{nama,kategori:$('#ac').value,prefix:p,catatan:$('#at').value,personal:$('#ape').checked,photo:AT.img});if(!r.ok)throw new Error(r.error);toast('Alat ditambahkan: '+r.id);await load('tools');labelModal(r.id)})}
function labelModal(id){const t=byId(id);modal(`<div style="display:flex;justify-content:space-between"><h2 style="font-size:18px">Label Barcode</h2><button class="o" onclick="modal()">✕</button></div>
<div style="text-align:center"><div id="lq" style="display:inline-block;padding:10px;background:#fff;border:1px solid var(--br);border-radius:10px"></div><h2 style="font-size:18px;margin:8px 0 2px">${esc(t.name)}</h2><b>${id}</b><br>${pill(t.st)}</div>
${imgOf(t)?`<label>Foto kondisi awal</label>${ph2(imgOf(t),'Kondisi awal · '+t.name)}`:''}
<p class="mu">Cetak lalu tempel pada alat. Scan label membuka detail dan status alat.</p>
<div style="display:flex;gap:8px;flex-wrap:wrap"><button onclick="lblPrint('${id}')">🖨 Cetak Label</button><button class="o" onclick="lblDl('${id}')">⬇ Unduh QR</button><button class="o" onclick="modal()">Tutup</button></div>`);
try{new QRCode($('#lq'),{text:id,width:180,height:180})}catch(e){}}
const qrUrl=()=>{const c=document.querySelector('#lq canvas');if(c)return c.toDataURL('image/png');const i=document.querySelector('#lq img');return i?i.src:''};
function lblDl(id){const u=qrUrl();if(!u)return toast('QR belum siap');const a=document.createElement('a');a.href=u;a.download=id+'.png';document.body.appendChild(a);a.click();a.remove()}
function lblPrint(id){const u=qrUrl();if(!u)return toast('QR belum siap');const t=byId(id),w=window.open('','_blank','width=420,height=520');if(!w)return toast('Pop-up diblokir browser, izinkan pop-up untuk mencetak');
w.document.write(`<!doctype html><title>${id}</title><style>body{font-family:system-ui,sans-serif;margin:0;display:flex;justify-content:center}.l{width:62mm;border:1px solid #000;padding:3mm;margin:6mm;text-align:center}.l img{width:50mm;height:50mm}.l b{display:block;font-size:13pt}.l span{font-size:9pt}.l small{display:block;font-size:7pt;margin-bottom:1mm}</style><div class="l"><small>BIZNET · KUMAT</small><img src="${u}"><b>${id}</b><span>${esc(t.name)}</span></div><script>onload=()=>{print()}<\/script>`);w.document.close()}
function setFoto(id){const i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=()=>{if(i.files[0])shrink(i.files[0],d=>run(null,async()=>{const r=await api('setInitialPhoto',id,d);if(!r.ok)throw new Error(r.error);toast('Foto kondisi awal diperbarui');await load();det(id)}))};i.click()}
const chipsH=()=>cart.map(i=>`<span class="chip on" onclick="togC('${i}')">${esc(byId(i).name)} ✕</span>`).join('')||'<span class="mu">Belum ada tools dipilih</span>';
const ulist=()=>{const s=($('#us')?$('#us').value:'').toLowerCase();return D.tools.filter(t=>!t.pers&&(t.name+t.id).toLowerCase().includes(s)).sort((a,b)=>(a.st==='used'?1:0)-(b.st==='used'?1:0)||a.id.localeCompare(b.id)).map(t=>{const ok=t.st!=='used',on=cart.includes(t.id);return`<div class="row" style="${ok?'':'opacity:.55'}" onclick="togC('${t.id}')">${th(t)}<div><b>${esc(t.name)}</b> <span class="mu">${t.id}</span><br>${pill(t.st)}${ok?'':' <span class="mu">sedang dipakai team lain</span>'}</div>${on?'<span class="pill" style="background:#16a34a;color:#fff">✓ Dipilih</span>':ok?'<span class="mu">Pilih</span>':''}</div>`}).join('')||'<span class="mu">Tidak ditemukan</span>'};
function togC(id){const t=byId(id);if(!cart.includes(id)&&t.st==='used')return toast(t.name+' sedang dipakai team lain. Selesaikan pengembalian dulu.');cart=cart.includes(id)?cart.filter(x=>x!==id):[...cart,id];$('#cc').innerHTML=chipsH();$('#ul').innerHTML=ulist()}
const tn=s=>String(s==null?'':s).replace(/\s+/g,' ').trim().toLowerCase(),sameT=(a,b)=>tn(a)===tn(b);
const teamsAll=()=>{const L=[...D.teams];act().forEach(a=>{if(!L.some(t=>sameT(t,a.team)))L.push(a.team)});return L};
/* ===== Penampil foto (ikon mata) & Before/After ===== */
const ph2=(src,t)=>src?`<div class="pw2"><img src="${src}" data-t="${esc(t||'')}"><button class="eye" title="Lihat foto" onclick="event.stopPropagation();pvEl(this)">👁</button></div>`:'<div class="ph">Tidak ada foto</div>';
function pvEl(b){const i=b.parentElement.querySelector('img');if(i)pv(i.src,i.dataset.t)}
function pv(src,t){let v=$('#pv');if(!v){v=document.createElement('div');v.id='pv';document.body.appendChild(v)}v.innerHTML=`<div class="pvh"><b>${esc(t||'Foto')}</b><button onclick="pvX()">✕ Tutup</button></div><div class="pvb"><img src="${src}" onclick="this.classList.toggle('z')"></div><div class="pvf">Ketuk foto untuk zoom · geser untuk melihat detail</div>`;v.style.display='flex'}
function pvX(){const v=$('#pv');if(v)v.style.display='none'}
document.addEventListener('keydown',e=>{if(e.key==='Escape')pvX()});
function retPhoto(f){if(!f)return;shrink(f,d=>{RP.img=d;$('#af').outerHTML='<div id="af" class="pw2"><img src="'+d+'" data-t="Kondisi kembali"><button class="eye" onclick="event.stopPropagation();pvEl(this)">👁</button></div>'})}
function cmp(xid,tid){const x=D.tx.find(a=>a.id===xid),r=x&&x.rets.find(a=>a.id===tid),t=byId(tid);if(!r)return;const bf=r.before||imgOf(t);
modal(`<div style="display:flex;justify-content:space-between"><h2 style="font-size:18px">${esc(t.name)}</h2><button class="o" onclick="modal()">✕</button></div>
<p class="mu">${esc(x.team)} · ${x.members.map(esc).join(', ')}<br>${fd(x.start)} → ${fd(r.t)} ${r.ok?pill('normal'):pill('check')}</p>
<div class="ba"><div><span class="mu">Sebelum (kondisi awal)</span>${ph2(bf,t.name+' · Sebelum')}</div><div><span class="mu">Sesudah (saat kembali)</span>${ph2(r.after,t.name+' · Sesudah')}</div></div>
${r.chk&&r.chk.length?`<label>Hasil checklist</label>${CHK.map((c,i)=>`<div class="chk">${r.chk[i]?'✅':'❌'} ${c}</div>`).join('')}`:''}
${r.note?`<label>Catatan</label><div>${esc(r.note)}</div>`:''}
<div style="margin-top:12px"><button class="o" onclick="modal()">Tutup</button></div>`)}
function rpt(id){const n=prompt('Jelaskan kerusakan / masalah:');if(n)run(null,async()=>{const r=await api('setStatus',id,'check',n);if(!r.ok)throw new Error(r.error);modal();toast('Dilaporkan: Perlu Pemeriksaan');await load()})}
const av=(n,z=34)=>{const a=D.acc.find(x=>x.nama===n),p=a&&AV[a.email];return p?`<img class="av" style="width:${z}px;height:${z}px" src="${p}">`:`<i class="av" style="width:${z}px;height:${z}px;background:#64748b;font-size:${z/2.6}px">${esc(String(n).split(' ').map(w=>w[0]).slice(0,2).join(''))}</i>`};
const avE=(e,z=36)=>AV[e]?`<img class="av" style="width:${z}px;height:${z}px" src="${AV[e]}">`:`<i class="av" style="width:${z}px;height:${z}px;background:#0b4fc4">${esc((SES.user.nama||'?')[0])}</i>`;
function showLogin(msg){stopScan();document.body.classList.add('home');modal();$('#main').innerHTML=`<div class="lgn"><div class="lb"><svg class="tw" viewBox="0 0 200 420"><path d="M40 400H160M51 330H149M62 260H138M73 190H127M84 120H116M94 60H106M40 400L149 330M160 400L51 330M51 330L138 260M149 330L62 260M62 260L127 190M138 260L73 190M73 190L116 120M127 190L84 120M84 120L106 60M116 120L94 60M40 400L100 20L160 400M100 20V0"/></svg><div class="lc"><svg width="64" height="64" viewBox="0 0 64 64" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"><path d="M16 50 42 24M48 50 22 24"/><circle cx="46" cy="18" r="8"/><rect x="8" y="8" width="18" height="11" rx="2" transform="rotate(-45 17 13)" fill="#fff"/></svg><h1>KUMAT</h1><p style="font-size:18px;margin:2px 0 18px">Keluar Masuk Tools</p><p class="tg">Tools Aman<br>Kerja Lancar<br>Jaringan Terjaga</p></div></div><div class="lf"><div class="fi"><h2>Masuk</h2><p class="mu" style="margin:0 0 6px">Gunakan email Biznet dan password Anda.</p><label>Email</label><input id="le" type="email" autocomplete="username" placeholder="nama@biznetnetworks.com" onkeydown="if(event.key==='Enter')$('#lp').focus()"><label>Password</label><div class="pw"><input id="lp" type="password" autocomplete="current-password" placeholder="Password" onkeydown="if(event.key==='Enter')doLogin()"><span onclick="const i=$('#lp');i.type=i.type==='password'?'text':'password'">👁</span></div><p id="lerr" class="er"></p><button id="lb2" onclick="doLogin()">Masuk</button><div class="bz2"><b>Biznet</b><br>Branch Campang Raya</div></div></div></div>`;if(msg)$('#lerr').textContent=msg}
async function doLogin(){const b=$('#lb2');b.disabled=true;$('#lerr').textContent='';try{SES=await api('login',$('#le').value,$('#lp').value);saveS();await load(innerWidth<761?'home':'dash');if(SES&&SES.user.mustChange)pwModal(true)}catch(e){SES=null;saveS();if($('#lerr')){$('#lerr').textContent=e.message;b.disabled=false}}}
function menu(){const u=SES.user;modal(`<div style="text-align:center">${avE(u.email,72)}<h2 style="font-size:18px;margin-top:8px">${esc(u.nama)}</h2><p class="mu">${esc(u.email)}<br>${isOwner()?'Owner · Super Admin (akses penuh)':'User (input keluar-masuk tools, lihat semua)'}</p></div><button style="width:100%;margin-top:8px" onclick="pwModal()">🔑 Ubah Password</button>${isOwner()?'<button class="o" style="width:100%;margin-top:8px" onclick="addToolModal()">➕ Tambah Alat</button><button class="o" style="width:100%;margin-top:8px" onclick="usersModal()">👥 Kelola Pengguna</button>':''}<button class="o" style="width:100%;margin-top:8px" onclick="logout()">Keluar</button><button class="o" style="width:100%;margin-top:8px" onclick="modal()">Tutup</button>`)}
function pwModal(f){MF=!!f;modal(`<h2 style="font-size:18px">${f?'Buat password baru':'Ubah Password'}</h2>${f?'<p class="mu">Anda masih memakai password awal. Buat password baru (min. 8 karakter) untuk melanjutkan.</p>':''}<label>Password saat ini</label><input id="p0" type="password"><label>Password baru</label><input id="p1" type="password"><label>Ulangi password baru</label><input id="p2" type="password"><div style="margin-top:12px;display:flex;gap:8px"><button id="pb" onclick="pwSave()">Simpan</button>${f?'':'<button class="o" onclick="modal()">Batal</button>'}</div>`)}
function pwSave(){const o=$('#p0').value,n=$('#p1').value;if(n.length<8)return toast('Password baru minimal 8 karakter');if(n!==$('#p2').value)return toast('Konfirmasi password tidak sama');run($('#pb'),async()=>{const r=await api('changePassword',o,n);if(!r.ok)throw new Error(r.error);MF=false;SES.user.mustChange=false;saveS();modal();toast('Password diperbarui')})}
function usersModal(){modal(`<h2 style="font-size:18px">Kelola Pengguna</h2><p class="mu">Reset menetapkan password sementara; pengguna wajib menggantinya saat masuk.</p>${D.acc.map(a=>`<div class="row" style="cursor:default">${avE(a.email,44)}<div><b>${esc(a.nama)}</b><br><span class="mu">${esc(a.email)} · ${a.role==='owner'?'Owner':'User'}</span></div><button class="o" onclick="rst('${a.email}')">Reset</button></div>`).join('')}<button class="o" style="margin-top:10px" onclick="modal()">Tutup</button>`)}
function rst(e){const p=prompt('Password sementara baru untuk '+e+' (min. 8 karakter):');if(!p)return;if(p.length<8)return toast('Minimal 8 karakter');run(null,async()=>{const r=await api('resetPassword',e,p);if(!r.ok)throw new Error(r.error);toast('Password direset')})}
function logout(){api('logout').catch(()=>{});SES=null;saveS();modal();showLogin()}
if(SES&&SES.token)load(innerWidth<761?'home':'dash');else showLogin();
</script></body></html>
