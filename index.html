<!doctype html><html lang="id"><head><base target="_top"><meta charset="utf-8"><title>KUMAT – Keluar Masuk Tools</title><meta name="theme-color" content="#0a2f7a">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--bg:#eef3fb;--cd:#fff;--tx:#0f172a;--mu:#64748b;--br:#e5ebf5;--pr:#0b4fc4;--nv:#0a2f7a}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{background:linear-gradient(180deg,#0b3d9e,#072463);color:#fff;padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:3px}
.br{display:flex;gap:10px;align-items:center;padding:4px 8px 20px}.br b{font-size:22px;display:block;line-height:1}.br small{font-size:11px;opacity:.85}.lg{font-size:30px}
aside a{display:flex;gap:12px;align-items:center;padding:11px 12px;border-radius:10px;color:#cfe0ff;cursor:pointer}aside a i{font-style:normal;width:20px;text-align:center}aside a.on{background:#1a5fe0;color:#fff;font-weight:600}
.bz{margin-top:auto;padding:8px}.bz b{font-size:22px;display:block}.bz small{opacity:.8;font-size:11px}
#w{min-width:0}.top{display:flex;align-items:center;gap:12px;padding:20px 24px 4px}.top h2{margin:0;font-size:24px}.top .sub{margin:2px 0 0;color:var(--mu)}.top>div:nth-child(2){flex:1}.bk{display:none}
.rt{display:flex;gap:14px;align-items:center}.dt{background:var(--cd);border:1px solid var(--br);border-radius:10px;padding:8px 12px}.us{display:flex;gap:8px;align-items:center}.us i{width:36px;height:36px;border-radius:50%;background:var(--pr);color:#fff;display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:700}.us small{display:block;color:var(--mu);font-size:11px}
main{padding:14px 24px 28px;max-width:1240px}
h2{margin:0 0 4px;font-size:22px}.mu{color:var(--mu)}
.card{background:var(--cd);border:1px solid var(--br);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px #0a2f7a0d}
.g{display:grid;gap:14px}.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g6{grid-template-columns:repeat(6,1fr)}.gw{grid-template-columns:1.5fr 1fr}.gt{grid-template-columns:1fr 1.15fr}
.stc{display:flex;gap:12px;align-items:center;margin:0}.stc b{font-size:28px;display:block;line-height:1.1}.stc span{font-size:12px}
.ic{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:21px;color:#fff;flex:none}
.sf{border:1px solid var(--br);border-radius:12px;padding:10px 4px;text-align:center}.sf .si{font-size:26px}.sf span{display:block;font-size:11px;color:var(--mu)}.sf b{display:block;font-size:19px}.sf em{font-size:10px;font-style:normal}
.pill{color:#fff;border-radius:6px;padding:2px 8px;font-size:11px;font-weight:600;white-space:nowrap}
.row{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--br);cursor:pointer}.row:last-child{border:0}.row>div{flex:1;min-width:0}
.row img,.ph{width:54px;height:54px;border-radius:10px;object-fit:cover;background:var(--br);display:flex;align-items:center;justify-content:center;flex:none}
button{background:var(--pr);color:#fff;border:0;border-radius:10px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer}button.o{background:#fff;color:var(--pr);border:1px solid var(--pr)}button:disabled{opacity:.5}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--br);border-radius:10px;background:#fff;color:var(--tx);font:inherit}input[type=checkbox]{width:auto}
label{display:block;margin:8px 0 3px;font-weight:600;font-size:12px}
.chips,.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.chip{padding:5px 11px;border-radius:99px;border:1px solid var(--br);cursor:pointer;font-size:12px;background:#fff}.chip.on{background:var(--pr);color:#fff;border-color:var(--pr)}
.tabs span{padding:6px 12px;border-radius:8px;cursor:pointer;color:var(--mu)}.tabs span.on{background:#e8f0ff;color:var(--pr);font-weight:700}
.chk{display:flex;gap:8px;align-items:center;font-weight:400;font-size:13px;margin:5px 0}
table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:9px 6px;border-bottom:1px solid var(--br);font-size:13px;vertical-align:top}th{color:var(--mu);font-size:12px}.tbl{overflow-x:auto}
.donut{width:130px;height:130px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}.donut i{width:86px;height:86px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:700;font-size:22px}
.tm{display:flex;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--br)}.tm .ic{width:38px;height:38px;font-size:17px}.tm>div{flex:1}.tm b.n{font-size:16px}
#md{position:fixed;inset:0;background:#0009;display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:20px;z-index:9}#md>div{background:#fff;border-radius:16px;padding:16px;max-width:480px;width:100%}
.ba{display:grid;grid-template-columns:1fr 1fr;gap:8px}.ba img,.ba .ph{width:100%;height:120px;border-radius:10px;object-fit:cover}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:10px;display:none;z-index:10;max-width:90%}
.hm{min-height:100vh;display:flex;flex-direction:column;justify-content:flex-end;padding:28px;color:#fff;background:linear-gradient(180deg,#0a2f7a,#1a5fe0 55%,#0a2f7a)}.hm h1{font-size:44px;margin:0}.hm .lg{font-size:70px}.hm button{width:100%;margin-top:10px;padding:14px}.hm .o{background:transparent;color:#fff;border-color:#fff}.hm>div{max-width:420px;width:100%;margin:0 auto}
body.home aside,body.home .top{display:none}body.home main{padding:0;max-width:none}
.sc{max-width:480px;margin:0 auto;text-align:center}.vw{position:relative}.vw video{width:100%;height:340px;object-fit:cover;border-radius:16px;background:#0a1a3f}.fr{position:absolute;inset:50px 70px;border:3px solid #4d8dff;border-radius:14px}
@media(max-width:760px){#app{display:block}aside{position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;flex-direction:row;padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px));z-index:5;gap:0;border-radius:18px 18px 0 0;box-shadow:0 -4px 16px #0003}.br,.bz,aside a.dk{display:none}aside a{flex:1;flex-direction:column;gap:2px;padding:6px 2px;font-size:10px;text-align:center}aside a.fab i{background:#fff;color:var(--pr);width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-top:-24px;font-size:22px;box-shadow:0 4px 10px #0004}
.top{position:fixed;top:0;left:0;right:0;z-index:4;background:linear-gradient(90deg,#0b3d9e,#1a5fe0);color:#fff;padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top,0px))}.top h2{font-size:18px;margin:0}.top .sub,.rt{display:none}.bk{display:block;font-size:30px;line-height:1;cursor:pointer}.d0 .bk{display:none}
main{padding:calc(72px + env(safe-area-inset-top,0px)) 12px 100px}.g4,.g2{grid-template-columns:1fr 1fr}.gw,.gt,.g3{grid-template-columns:1fr}.g6{grid-template-columns:repeat(3,1fr)}.stc b{font-size:22px}.ic{width:40px;height:40px}}
</style></head><body>

<div class="g gw"><div class="card"><b>Status Alat Keselamatan</b><div class="g g6" style="margin-top:10px;gap:8px">${SAF.map(([k,n],i)=>{const I=D.tools.filter(t=>t.id.startsWith('KUM-'+k)),o=I.filter(t=>t.st!=='none').length,bad=I.filter(t=>['broken','check','repair'].includes(t.st)).length,col=o>=6&&!bad?'#16a34a':o===0?'#dc2626':'#f59e0b';return`<div class="sf"><div class="si">${IC[i]}</div><span>${n}</span><b style="color:${col}">${o}/6</b><em style="color:${col}">${bad?bad+' bermasalah':o>=6?'(OK)':o?'(Kurang)':'(Belum ada)'}</em></div>`}).join('')}</div></div>
<div class="card"><b>Ringkasan Tools</b><div style="display:flex;gap:16px;align-items:center;margin-top:10px"><div class="donut" style="background:conic-gradient(${cg})"><i>${tot}</i></div><div style="flex:1">${Object.keys(ST).filter(k=>c(k)).map(k=>`<div style="display:flex;justify-content:space-between;margin-bottom:4px"><span><span style="color:${ST[k][1]}">●</span> ${ST[k][0]}</span><b>${c(k)}</b></div>`).join('')}</div></div></div></div>
${D.notif.length?`<div class="card"><b>🔔 Notifikasi Branch Leader</b>${D.notif.slice(-3).reverse().map(n=>`<div class="row" style="cursor:default"><div>${esc(n.m)}<br><span class="mu">${fd(n.t)}</span></div></div>`).join('')}</div>`:''}
<div class="g gw"><div class="card"><b>Penggunaan Hari Ini</b><div class="tbl"><table><tr><th>No</th><th>Team</th><th>Anggota</th><th>Tools</th><th>Waktu</th><th>Status</th></tr>${today.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.team)}</td><td>${x.members.map(esc).join(', ')}</td><td>${x.tools.map(i=>esc(byId(i).name)).join(', ')}</td><td>${fd(x.start)}</td><td>${x.end?'<span class="pill" style="background:#16a34a1f;color:#16a34a">Selesai</span>':'<span class="pill" style="background:#2563eb1f;color:#2563eb">Berjalan</span>'}</td></tr>`).join('')||'<tr><td colspan=6 class="mu">Belum ada penggunaan hari ini</td></tr>'}</table></div></div>
<div class="card"><b>Team</b>${D.teams.map(t=>{const x=A.find(a=>a.team===t);return`<div class="tm"><div class="ic" style="background:#2f80ed">👥</div><div><b>${esc(t)}</b><br><span class="mu">${x?'Aktif · '+x.tools.length+' tools':'Tidak aktif'}</span></div><b class="n">${x?x.members.length:0}/6</b></div>`}).join('')}<button class="o" style="width:100%;margin-top:12px" onclick="go('team')">Lihat Semua Team</button></div></div>`},
tools(){const T={VST:['Vest',['VST']],HLM:['Helm',['HLM']],GLV:['Sarung Tangan',['GLV']],KCM:['Kacamata',['KCM']],OTH:['Lainnya',['HRN','BLT']]},sl=D.tools.filter(t=>t.cat==='safety'&&T[stab][1].some(p=>t.id.startsWith('KUM-'+p)));
return`<div class="g gt"><div class="card"><b style="font-size:16px">Status Alat Keselamatan</b><div class="tabs">${Object.keys(T).map(k=>`<span class="${k===stab?'on':''}" onclick="stab='${k}';go('tools')">${T[k][0]}</span>`).join('')}</div>${sl.map(rw).join('')||'<span class="mu">Belum ada data untuk kategori ini</span>'}</div>
<div class="card"><b style="font-size:16px">Tools</b><input style="margin-top:10px" placeholder="🔍 Cari tools..." value="${esc(q)}" oninput="q=this.value;$('#tl').innerHTML=tlist()"><div id="tl">${tlist()}</div></div></div>`},
use(){const A=act().flatMap(x=>x.members);
return`<h2>Penggunaan Tools</h2><p class="mu">Scan / ketik ID barang, pilih team dan anggota (1–6 orang).</p>
<div class="card"><label>ID Barang (hasil scan barcode / input manual)</label><div style="display:flex;gap:8px"><input id="sid" list="ids" placeholder="KUM-OTDR-001"><button onclick="addC()">Tambah</button></div>
<datalist id="ids">${D.tools.filter(t=>t.st==='normal'&&!t.pers).map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</datalist>
<div class="chips">${cart.map(i=>`<span class="chip on" onclick="cart=cart.filter(x=>x!=='${i}');go('use')">${esc(byId(i).name)} ✕</span>`).join('')||'<span class="mu">Belum ada tools dipilih</span>'}</div>
<label>Team</label><select id="tm">${D.teams.map(t=>`<option>${esc(t)}</option>`).join('')}</select>
<label>Anggota (maks 6)</label>${D.users.map(p=>`<label class="chk"><input type="checkbox" class="mb" value="${esc(p)}" ${A.includes(p)?'disabled':''}> ${esc(p)} ${A.includes(p)?'<span class="mu">(sudah di team aktif)</span>':''}</label>`).join('')}
<label>Keterangan (opsional)</label><input id="nt" placeholder="Keperluan, mis. maintenance jaringan di Way Laga">
<p class="mu">Waktu mulai dicatat otomatis saat disimpan.</p><button id="bu" onclick="useSave()">Simpan & Gunakan</button></div>`},
ret(){const A=act();return`<h2>Pengembalian</h2>${A.map(x=>`<div class="card"><b>${esc(x.team)}</b> <span class="mu">· ${x.members.map(esc).join(', ')} · mulai ${fd(x.start)}</span>${x.tools.map(i=>{const t=byId(i),done=x.rets.find(r=>r.id===i);return`<div class="row" ${done?'':`onclick="retOpen('${x.id}','${i}')"`}>${th(t)}<div><b>${esc(t.name)}</b><br><span class="mu">${i}</span></div>${done?'<span class="pill" style="background:#16a34a">Sudah kembali</span>':'<button>Kembalikan</button>'}</div>`}).join('')}</div>`).join('')||'<div class="card mu">Tidak ada penggunaan aktif.</div>'}`},
team(){const A=act();return`<h2>Team & Anggota</h2><div class="g g3">${D.teams.map(t=>{const x=A.find(a=>a.team===t);return`<div class="card"><b>${esc(t)}</b><br>${x?`<span class="pill" style="background:#2563eb">Aktif</span> ${x.members.length}/6 anggota<div class="mu" style="margin-top:6px">${x.members.map(esc).join(', ')}</div><div style="margin-top:6px">${x.tools.map(i=>esc(byId(i).name)).join(', ')}</div>`:'<span class="mu">Tidak ada penggunaan aktif</span>'}</div>`}).join('')}</div>
<div class="card"><b>Anggota</b>${D.users.map(p=>{const x=A.find(a=>a.members.includes(p));return`<div class="row" style="cursor:default"><div>${esc(p)}</div>${x?`<span class="mu">${esc(x.team)}</span> <span class="pill" style="background:#2563eb">Aktif</span>`:'<span class="pill" style="background:#94a3b8">Belum mulai</span>'}</div>`}).join('')}</div>`},
rep(){const R=D.tx.flatMap(x=>x.rets.map(r=>({...r,x}))),cnt={};D.tx.forEach(x=>x.tools.forEach(i=>cnt[i]=(cnt[i]||0)+1));
const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,5),bad=R.filter(r=>!r.ok).pop(),avg=R.length?R.reduce((s,r)=>s+(r.t-r.x.start),0)/R.length/36e5:0;
return`<h2>Laporan</h2><div class="g g2"><div class="card"><b>Siapa memakai tool ini (30 hari)?</b><select onchange="$('#r1').innerHTML=rep1(this.value)"><option value="">Pilih tool…</option>${D.tools.filter(t=>!t.pers).map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select><div id="r1" class="mu" style="margin-top:8px"></div></div>
<div class="card"><b>Tools siap digunakan hari ini</b><h2>${D.tools.filter(t=>t.st==='normal'&&!t.pers).length}</h2></div>
<div class="card"><b>Tools paling sering digunakan</b><div style="margin-top:6px">${top.map(([i,n])=>`${esc(byId(i).name)}: ${n}×`).join('<br>')||'<span class="mu">Belum ada data</span>'}</div></div>
<div class="card"><b>Tools di luar branch</b><div style="margin-top:6px">${D.tools.filter(t=>t.st==='loan').map(t=>esc(t.name)+' – '+esc(t.note)).join('<br>')||'<span class="mu">Tidak ada</span>'}</div></div>
<div class="card"><b>Terakhir dikembalikan bermasalah</b><div style="margin-top:6px">${bad?`${esc(byId(bad.id).name)} oleh ${bad.x.members.map(esc).join(', ')} (${fd(bad.t)})`:'<span class="mu">Belum ada</span>'}</div></div>
<div class="card"><b>Rata-rata durasi di tangan teknisi</b><h2>${avg?avg.toFixed(1)+' jam':'–'}</h2></div></div>
<div class="card"><b>Riwayat Penggunaan</b>${R.sort((a,b)=>b.t-a.t).map(r=>`<div class="row" style="cursor:default">${th(byId(r.id))}<div><b>${esc(byId(r.id).name)}</b><br><span class="mu">${esc(r.x.team)} · ${r.x.members.map(esc).join(', ')}<br>${fd(r.x.start)} → ${fd(r.t)}</span></div>${r.ok?'<span class="pill" style="background:#16a34a">Selesai</span>':'<span class="pill" style="background:#ca8a04">Perlu Pemeriksaan</span>'}</div>`).join('')||'<span class="mu">Belum ada riwayat</span>'}</div>`}};
function rep1(id){if(!id)return'';const lim=Date.now()-30*864e5,L=D.tx.filter(x=>x.tools.includes(id)&&x.start>lim);return L.map(x=>`${fd(x.start)} · ${esc(x.team)}: ${x.members.map(esc).join(', ')}`).join('<br>')||'Tidak ada penggunaan'}
const flt=()=>D.tools.filter(t=>(fl==='all'||t.st===fl)&&(t.name+t.id).toLowerCase().includes(q.toLowerCase()));
const rows=L=>L.map(t=>`<div class="row" onclick="det('${t.id}')">${th(t)}<div><b>${esc(t.name)}</b> <span class="mu">${t.id}</span><br><span class="mu">${esc(t.note)}</span></div>${pill(t.st)}</div>`).join('')||'<span class="mu">Tidak ditemukan</span>';
function list(){$('#lst').innerHTML=rows(flt())}
function det(id){const t=byId(id),h=D.tx.filter(x=>x.tools.includes(id)).sort((a,b)=>b.start-a.start).slice(0,3);
modal(`<div style="display:flex;justify-content:space-between"><h2 style="font-size:18px">${esc(t.name)}</h2><button class="o" onclick="modal()">✕</button></div>${imgOf(t)?`<img src="${imgOf(t)}" style="width:100%;height:160px;object-fit:cover;border-radius:10px">`:''}
<p>${pill(t.st)} <span class="mu">${id}</span></p><p>${esc(t.note)||'<span class="mu">Tanpa catatan</span>'}</p><div id="qr" style="margin:8px 0"></div>
<label>Ubah status (Branch Leader)</label><select onchange="setSt('${id}',this.value)" ${t.st==='used'?'disabled':''}>${Object.keys(ST).map(k=>`<option value="${k}" ${k===t.st?'selected':''}>${ST[k][0]}</option>`).join('')}</select>
<label>Riwayat terakhir</label><div class="mu">${h.map(x=>`${fd(x.start)} · ${esc(x.team)} (${x.members.map(esc).join(', ')})`).join('<br>')||'Belum pernah digunakan'}</div>
<div style="margin-top:12px">${t.st==='normal'&&!t.pers?`<button onclick="cart.includes('${id}')||cart.push('${id}');modal();go('use')">Gunakan</button>`:''} <button class="o" onclick="modal();go('rep')">Riwayat Penggunaan</button> <button class="o" onclick="rpt('${id}')">Laporkan Kerusakan</button></div>`);
try{new QRCode($('#qr'),{text:id,width:110,height:110})}catch(e){}}
async function run(btn,fn){if(busy)return;busy=true;if(btn)btn.disabled=true;try{return await fn()}catch(e){toast(e.message)}finally{busy=false;if(btn)btn.disabled=false}}
function setSt(id,s){run(null,async()=>{const r=await api('setStatus',id,s);if(!r.ok)throw new Error(r.error);modal();toast(byId(id).name+' → '+ST[s][0]);await load()})}
function addC(){const v=$('#sid').value.trim().toUpperCase(),t=D.tools.find(x=>x.id===v);if(!t)return toast('ID tidak ditemukan: '+v);if(t.pers)return toast('Vest & helm bersifat personal, tidak dipinjam');if(t.st!=='normal')return toast(t.name+' tidak bisa digunakan (status: '+ST[t.st][0]+')');if(!cart.includes(v))cart.push(v);go('use')}
function useSave(){const mem=[...document.querySelectorAll('.mb:checked')].map(e=>e.value),team=$('#tm').value;
if(!cart.length)return toast('Pilih minimal 1 tool');if(!mem.length||mem.length>6)return toast('Anggota harus 1–6 orang');
const note=$('#nt').value;run($('#bu'),async()=>{const r=await api('useTools',{team,members:mem,toolIds:cart,note});if(!r.ok)throw new Error(r.error);cart=[];toast('Penggunaan tersimpan');await load('ret')})}
function shrink(f,cb){const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const s=Math.min(1,480/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.7))};i.src=r.result};r.readAsDataURL(f)}
function retOpen(x,i){const t=byId(i);RP={x,i,img:''};modal(`<h2 style="font-size:18px">Pengembalian: ${esc(t.name)}</h2><div class="ba"><div><span class="mu">Kondisi awal</span>${imgOf(t)?`<img src="${imgOf(t)}">`:'<div class="ph">Tidak ada foto awal</div>'}</div><div><span class="mu">Kondisi kembali</span><div id="af" class="ph">Belum ada foto</div></div></div>
<label>Foto kondisi saat kembali (wajib)</label><input type="file" accept="image/*" capture="environment" onchange="shrink(this.files[0],d=>{RP.img=d;$('#af').outerHTML='<img id=af src='+d+'>'})">
<label>Checklist</label>${CHK.map(c=>`<label class="chk"><input type="checkbox" class="ck"> ${c}</label>`).join('')}
<label>Catatan (opsional)</label><textarea id="rn" rows="2"></textarea><div style="margin-top:12px;display:flex;gap:8px"><button id="br" onclick="retSave()">Simpan Pengembalian</button><button class="o" onclick="modal()">Batal</button></div>`)}
function retSave(){if(!RP.img)return toast('Foto kondisi kembali wajib diambil');const ck=[...document.querySelectorAll('.ck')].map(e=>e.checked),note=$('#rn').value;
run($('#br'),async()=>{const r=await api('returnTool',{txId:RP.x,toolId:RP.i,checks:ck,note,photo:RP.img});if(!r.ok)throw new Error(r.error);modal();toast(r.ok&&ck.every(Boolean)?'Pengembalian berhasil':'Tersimpan: Perlu Pemeriksaan, Branch Leader diberi notifikasi');await load('ret')})}
let stab='VST',stream,scanT;
const rw=t=>`<div class="row" onclick="det('${t.id}')">${th(t)}<div><b>${esc(t.name)}</b> ${pill(t.st)}<br><span class="mu">${esc(t.note)}</span></div><span class="mu">›</span></div>`;
const tlist=()=>D.tools.filter(t=>t.cat==='tool'&&(t.name+t.id).toLowerCase().includes(q.toLowerCase())).map(rw).join('')||'<span class="mu">Tidak ditemukan</span>';
function stopScan(){clearInterval(scanT);if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}
async function startScan(){const v=$('#cam');try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});v.srcObject=stream;await v.play();if(!('BarcodeDetector' in window))return toast('Scan otomatis belum didukung browser ini, gunakan Input Manual');const bd=new BarcodeDetector({formats:['qr_code','code_128']});scanT=setInterval(async()=>{try{const r=await bd.detect(v);if(r[0]){stopScan();found(r[0].rawValue)}}catch(e){}},400)}catch(e){toast('Kamera tidak bisa diakses, gunakan Input Manual')}}
function found(v){const id=String(v||'').trim().toUpperCase();if(!D.tools.find(t=>t.id===id))return toast('ID tidak ditemukan: '+id);stopScan();det(id)}
function rpt(id){const n=prompt('Jelaskan kerusakan / masalah:');if(n)run(null,async()=>{const r=await api('setStatus',id,'check',n);if(!r.ok)throw new Error(r.error);modal();toast('Dilaporkan: Perlu Pemeriksaan');await load()})}
load(innerWidth<761?'home':'dash');
</script></body></html>
